name: flutter_application_1
description: "A BIS BIG GAMES App"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1 # For Montserrat font
  carousel_slider: ^5.0.0 # For Carousel
  youtube_player_flutter: ^9.1.1 # For Youtube Player
  table_calendar: ^3.0.0 # For Calendar
  url_launcher: ^6.3.1 # For URL Launcher
  flutter_svg: ^2.0.17 # For SVG
  easy_splash_screen: ^1.0.4
  webview_flutter: ^3.0.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  assets:
    - assets/images/
    - assets/icons/
    - assets/sponsors/
  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
  uses-material-design: true
